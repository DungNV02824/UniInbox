# Hạ tầng cho môi trường dev. Chạy: docker compose up -d
# Cổng phía host đổi được qua biến môi trường (mặc định tránh 5432 hay bị chiếm).
name: dezon-inbox

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dezon
      POSTGRES_PASSWORD: dezon
      POSTGRES_DB: dezon_inbox
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dezon -d dezon_inbox']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible cho dev. MinIO đã ngừng phát hành image công khai nên dùng SeaweedFS
  # (xem docs/DECISIONS.md). Prod dùng Cloudflare R2 hoặc AWS S3.
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports:
      - '${S3_HOST_PORT:-8333}:8333'
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Tạo bucket mặc định một lần khi khởi động.
  s3-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      - s3
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 30); do
          echo 's3.bucket.create -name dezon-inbox' | weed shell -master=s3:9333 && exit 0
          sleep 2
        done
        exit 1
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_HOST_PORT:-1025}:1025'
      - '${MAILPIT_UI_HOST_PORT:-8025}:8025'

volumes:
  pgdata:
  redisdata:
  s3data:
